# Sunshine - tuning LATENCY RENDAH untuk hotspot HP (2.4GHz)
capture = wlr
encoder = vaapi
adapter_name = /dev/dri/renderD128
output_name = eDP-1
native_pen_touch = enabled

# --- latency & bandwidth ---
fps = 60
# encoder: prioritaskan kecepatan, bukan kualitas maksimal
vaapi_quality = speed
# rate control CBR, buffer kecil = latency rendah
vaapi_rc = cbr
# QP lebih tinggi = bitrate lebih kecil = lebih lancar di 2.4GHz
qp = 28
# FEC: tahan packet loss (bagus utk WiFi)
fec_percentage = 20
# refresh periodis (kurangi artefak saat packet loss)
intra_refresh = 25
# thread encoder
min_threads = 4
# audio: kurangi latency
audio_sink = alsa
